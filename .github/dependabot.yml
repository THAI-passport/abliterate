version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # @astrojs/check requires TypeScript 5/6 and does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
